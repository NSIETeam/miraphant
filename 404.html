<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Miraphant</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fff; color: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 64px 24px; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .container { width: min(100%, 640px); }
  .code {
    font-size: clamp(64px, 14vw, 96px); font-weight: 550;
    letter-spacing: -0.05em; line-height: 1;
    margin: 30px 0 22px; color: #0a0a0a;
  }
  .message {
    max-width: 420px; margin: 0 auto 30px;
    font-size: 17px; color: #7d8187; line-height: 27px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 24px; border-radius: 999px;
    background: #0a0a0a; color: #fff;
    font-weight: 550; font-size: 14px;
    text-decoration: none; transition: opacity 150ms;
  }
  .btn:hover { opacity: .84; }
  .btn:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 3px; }
  .logo-mark { width: 30px; height: 30px; filter: invert(1); }
  @media (prefers-reduced-motion: reduce) { .btn { transition-duration: .01ms; } }
</style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Miraphant" class="logo-mark">
    <div class="code">404</div>
    <p class="message">This page doesn't exist. But the intelligence does.</p>
    <a href="/miraphant/" class="btn">← Back to Miraphant</a>
  </div>
</body>
</html>
