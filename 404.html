<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Miraphant</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #f2df88; color: #171715;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 64px 24px; text-align: left;
    -webkit-font-smoothing: antialiased;
  }
  .container { position: relative; width: min(100%, 900px); padding: 64px; border: 1px solid rgba(23,23,21,.18); border-radius: 28px; background: rgba(255,255,255,.25); overflow: hidden; }
  .container::after { content: ""; position: absolute; right: -90px; bottom: -150px; width: 390px; height: 390px; border: 1px solid rgba(23,23,21,.18); border-radius: 50%; box-shadow: 0 0 0 48px rgba(255,255,255,.1), 0 0 0 96px rgba(255,255,255,.08); }
  .code {
    position: relative; z-index: 1; font-family: "Iowan Old Style", Baskerville, "Times New Roman", serif;
    font-size: clamp(112px, 22vw, 260px); font-weight: 400;
    letter-spacing: -0.08em; line-height: .7;
    margin: 32px 0 44px; color: #171715;
  }
  .message {
    position: relative; z-index: 1; max-width: 420px; font-size: 18px; color: #5d5945; line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 28px; border-radius: 100px;
    position: relative; z-index: 1; background: #171715; color: #FFF;
    font-weight: 600; font-size: 14px;
    text-decoration: none; transition: all 0.2s;
  }
  .btn:hover { background: #222; transform: translateY(-2px); }
  .logo-mark { position: relative; z-index: 1; width: 36px; height: 28px; }
  @media (max-width: 640px) { .container { padding: 38px 28px; } .container::after { right: -230px; } }
</style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Miraphant" class="logo-mark">
    <div class="code">404</div>
    <p class="message">This page doesn't exist. But the intelligence does.</p>
    <a href="/miraphant/" class="btn">← Back to Miraphant</a>
  </div>
</body>
</html>
